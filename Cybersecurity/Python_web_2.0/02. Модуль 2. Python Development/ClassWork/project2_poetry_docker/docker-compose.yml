

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
     POSTGRES_DB: test
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: postgres    
     POSTGRES_HOST: db
     DEBUG: 0
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password


