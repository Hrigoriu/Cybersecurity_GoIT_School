[tool.poetry]
name = "personal-assistant"
version = "0.1.0"
description = "Мій персональний бот-асистент для керування контактами"
authors = ["Hrigoriu Programmer <Hrigoriu@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# Тут потрібно писати майбутні бібліотеки, наприклад:
# colorama = "^0.4.6" 
flask = "^3.1.2"

[tool.poetry.group.dev.dependencies]
# Тут потрібно писати бібліотеки для розробки (тести, лінтери)
pytest = "^8.0.0"

[tool.poetry.scripts]
# Це дозволить запускати бота командою 'poetry run start'
start = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
