{% extends 'base.html' %}

{% block content %}
<div class="card shadow border-info">
    <div class="card-header bg-info text-white">
        <h4 class="mb-0">🎉 Іменинники на цьому тижні</h4>
    </div>
    <div class="card-body">
        {% if birthdays %}
        <ul class="list-group">
            {% for item in birthdays %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>🎂 <strong>{{ item.name }}</strong></span>
                <span class="badge bg-primary rounded-pill">{{ item.congratulation_date }}</span>
            </li>
            {% endfor %}
        </ul>
        {% else %}
            <p class="text-muted">На цьому тижні свят немає.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
