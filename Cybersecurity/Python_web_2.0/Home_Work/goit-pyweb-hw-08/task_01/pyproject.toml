[tool.poetry]
name = "retro-quotes-db"
version = "0.1.0"
description = "Quote search engine with MongoDB, Redis, and Retro-Tech Terminal UI"
authors = ["Hrigoriu Programmer <Hrigoriu@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
mongoengine = "^0.27.0"
redis = "^5.0.1"
python-dotenv = "^1.0.1"
pymongo = "4.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
