[tool.poetry]
name = "scrapy-quotes-retro"
version = "0.1.0"
description = "Hybrid Django + Scrapy + MongoDB + PostgreSQL project"
authors = ["Hrigoriu Programmer <Hrigoriu@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Django stack
django = "^5.2"
psycopg2-binary = "^2.9.12"
django-environ = "^0.13.0"

# Scraping stack
scrapy = "^2.11.0"
requests = "^2.34.0"
beautifulsoup4 = "^4.14.3"

# MongoDB stack
mongoengine = "^0.27.0"
pymongo = "4.3.3"

# Utilities
python-dotenv = "^1.0.1"
colorama = "^0.4.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.0"
flake8 = "^7.0"
isort = "^6.0"
