<!-- templates/quotes/add_quote.html -->
{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-2xl mx-auto mt-6">
    <div class="bg-white p-10 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-sage/10">
        <div class="flex justify-between items-center mb-8 border-b border-sage/20 pb-4">
            <h2 class="text-2xl font-light text-charcoal">Додати нову цитату</h2>
            <a href="{% url 'quotes:quote_list' %}" class="text-sm text-gray-400 hover:text-charcoal transition">← Назад</a>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {% if field.help_text %}
                        <p class="text-xs text-gray-400 mb-2">{{ field.help_text }}</p>
                    {% endif %}
                    <div class="[&>input]:w-full [&>input]:px-4 [&>input]:py-3 [&>input]:rounded-xl [&>input]:border [&>input]:border-sage/30 [&>input]:bg-ecowhite [&>input]:outline-none [&>input]:focus:border-sage [&>textarea]:w-full [&>textarea]:px-4 [&>textarea]:py-3 [&>textarea]:rounded-xl [&>textarea]:border [&>textarea]:border-sage/30 [&>textarea]:bg-ecowhite [&>textarea]:outline-none [&>textarea]:focus:border-sage [&>select]:w-full [&>select]:px-4 [&>select]:py-3 [&>select]:rounded-xl [&>select]:border [&>select]:border-sage/30 [&>select]:bg-ecowhite [&>select]:outline-none [&>select]:focus:border-sage">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-charcoal text-white py-3 rounded-full hover:bg-opacity-90 transition font-medium mt-8 cursor-pointer">Зберегти цитату</button>
        </form>
    </div>
</div>
{% endblock %}
