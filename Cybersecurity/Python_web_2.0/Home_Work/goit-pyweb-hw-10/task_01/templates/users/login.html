<!-- templates/users/login.html -->
{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-md mx-auto mt-10">
    <div class="bg-white p-10 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-sage/10">
        <h2 class="text-2xl font-light text-center mb-8 text-charcoal">Вхід в систему</h2>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="w-full px-4 py-3 rounded-2xl border border-sage/30 focus:border-sage focus:ring-1 focus:ring-sage outline-none bg-ecowhite transition">
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-sage text-white py-3 rounded-full hover:bg-opacity-90 transition font-medium mt-4 cursor-pointer">Увійти</button>
        </form>
    </div>
</div>
{% endblock %}
