<!-- templates/users/register.html -->
{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-md mx-auto mt-10">
    <div class="bg-white p-10 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-sage/10">
        <h2 class="text-2xl font-light text-center mb-8 text-charcoal">Створити акаунт</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    <div class="[&>input]:w-full [&>input]:px-4 [&>input]:py-2 [&>input]:rounded-xl [&>input]:border [&>input]:border-sage/30 [&>input]:bg-ecowhite [&>input]:outline-none">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-charcoal text-white py-3 rounded-full hover:bg-opacity-90 transition font-medium mt-6 cursor-pointer">Зареєструватися</button>
        </form>
    </div>
</div>
{% endblock %}
